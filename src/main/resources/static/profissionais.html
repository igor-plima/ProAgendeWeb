<head>

<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="profissionais">
<header class="topo">
  <div class="container topo-conteudo">
    <a class="logo" href="index.html">📅 Pro<span>Agende</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
    <nav id="menu"><a href="index.html">Início</a><a href="clientes.html">Clientes</a><a href="profissionais.html" class=ativo aria-current=page>Profissionais</a><a href="servicos.html">Serviços</a><a href="agendamentos.html">Agendamentos</a></nav>
  </div>
</header>
<main class="container">
<h1>Profissionais</h1>
<div id="mensagem" class="mensagem" role="alert" hidden></div>
<section class="cartao"><h2 id="tituloForm">Novo profissional</h2>
<form id="formulario" novalidate><input type="hidden" id="id">
<div class="grade"><div class="campo"><label for="nome">Nome *</label><input type="text" id="nome" name="nome" placeholder="Ex.: Ana Lima" ><small class="erro" id="erro-nome"></small></div><div class="campo"><label for="email">E-mail *</label><input type="email" id="email" name="email" placeholder="ana@email.com" ><small class="erro" id="erro-email"></small></div><div class="campo"><label for="telefone">Telefone * (DDD + número)</label><input type="tel" id="telefone" name="telefone" placeholder="11999998888" maxlength=11 inputmode=numeric><small class="erro" id="erro-telefone"></small></div></div>
<div class="botoes"><button type="submit" class="btn primario">Salvar</button><button type="reset" class="btn" id="btnLimpar">Limpar</button></div>
</form></section><section class="cartao"><h2>Profissionais cadastrados</h2>
<div class="rolagem"><table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Ações</th></tr></thead><tbody id="corpoTabela"></tbody></table></div>
<p class="vazio" id="vazio" hidden>Nenhum registro cadastrado.</p></section>
</main>
<footer class="rodape">ProAgende · Projeto Integrador SENAC · Etapa 8 (front-end, dados salvos no navegador)</footer>

<script src="js/paginas.js"></script>
</body>
</html>
